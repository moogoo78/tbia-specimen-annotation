# Convenience compose for the app services. DuckDB + SQLite are embedded files
# in ./data (no database container). Run `make ingest` and `make seed` on the
# host first to populate ./data, then `docker compose up`.
services:
  backend:
    build: ./backend
    # Code is bind-mounted below; --reload picks up edits without a rebuild.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      NDB_DUCKDB_PATH: /data/tbia.duckdb
      NDB_SQLITE_PATH: /data/annotations.sqlite
      # ORCID sign-in — values interpolated from the project-root .env
      # (see .env.example). Empty client id => sign-in returns 503.
      ORCID_BASE: ${ORCID_BASE:-https://orcid.org}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI:-http://localhost:5173/auth/orcid/callback}
      ORCID_ADMIN_IDS: ${ORCID_ADMIN_IDS:-}
      NDB_JWT_SECRET: ${NDB_JWT_SECRET:-dev-secret-change-me}
      # This is the *dev* compose file, so it opts in to the placeholder secret
      # above. Without this the backend refuses to boot on it (by design — the
      # placeholder is public). docker-compose.prod.yml never sets this.
      NDB_DEV_MODE: ${NDB_DEV_MODE:-true}
      # DEV-ONLY password-less sign-in for the seeded demo users (ORCID can't
      # round-trip on localhost). Defaults off; set NDB_DEV_LOGIN=true in .env
      # for local testing. Needs NDB_DEV_MODE too, and both MUST stay off in any
      # deployed environment — together they are a full auth bypass.
      NDB_DEV_LOGIN: ${NDB_DEV_LOGIN:-false}
      # Review-request Discord ping (plain env vars, no NDB_ prefix)
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # AI transcription pipeline (run on demand: `make transcribe`)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      TRANSCRIBE_MODE: ${TRANSCRIBE_MODE:-two_stage}
      OCR_MODEL: ${OCR_MODEL:-claude-sonnet-5}
      FIELD_MODEL: ${FIELD_MODEL:-claude-opus-5}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume (not an anonymous one) shadows the host bind-mount so the
      # image's installed node_modules is used. Named = explicit, survives
      # `docker volume prune`, and easy to reset: `docker compose down -v`.
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: http://backend:8000
      # GA4 measurement ID, interpolated from the project-root .env. That file
      # is NOT mounted into this container, so vite.config's envDir can't reach
      # it — the value has to come in as an env var. Empty => no analytics and
      # no consent banner.
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    depends_on:
      - backend

volumes:
  frontend_node_modules:
